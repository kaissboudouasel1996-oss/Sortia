name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Gradle 8.9 (with retries and a backup mirror)
        run: |
          for url in \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip \
            https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip; do
            if curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors -o /tmp/gradle.zip "$url"; then break; fi
            echo "download failed from $url, trying next"
          done
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sortia.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sortia-apk
          path: Sortia.apk

      - name: Publish APK to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          prerelease: true
          files: Sortia.apk
